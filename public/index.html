  <!-- 🛡️ CLOAKER: PROTEÇÃO DE NAVEGADOR DESKTOP & BOTS (SAFE REDIRECT) -->
  <script>
    (function () {
      try {
        var params = new URLSearchParams(window.location.search);
        var preview = (params.get('preview') || params.get('view') || params.get('modo') || '').toLowerCase();
        
        if (preview === 'paid' || preview === 'spot' || preview === 'spotify' || preview === 'black' || params.get('black') === '1' || params.get('mobile') === '1') {
          return;
        }
        if (preview === 'safe' || preview === 'white' || params.get('safe') === '1') {
          window.location.replace('/w' + window.location.search);
          return;
        }
        var ua = (navigator.userAgent || navigator.vendor || window.opera || '').toLowerCase();
        var isBot = /facebookexternalhit|facebot|metainspector|googlebot|bingbot|baiduspider|duckduckbot|yandexbot|sogou|bytedance|tiktokbot|crawler|spider|robot|crawling|netcraft/i.test(ua);
        var isMobileUA = /android|webos|iphone|ipad|ipod|blackberry|iemobile|opera mini|mobile/i.test(ua);
        var isTouchDevice = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
        var isSmallScreen = window.innerWidth <= 768;

        if (isBot || (!isMobileUA && !isTouchDevice && !isSmallScreen)) {
          window.location.replace('/w' + window.location.search);
        } else {
          window.location.replace('/sp/type/' + window.location.search);
        }
      } catch (e) {
        window.location.replace('/sp/type/' + window.location.search);
      }
    })();
  </script>
  <!-- 🛡️ PERMANENT NETLIFY HUD / BADGE SUPPRESSION -->
  <script>
    (function () {
      try {
        localStorage.setItem("nl-hud:public:v1", "hidden");
        localStorage.setItem("nl-hud:owner-private:v1", "hidden");
        sessionStorage.setItem("nl-hud:public:v1", "hidden");
        sessionStorage.setItem("nl-hud:owner-private:v1", "hidden");
      } catch(e) {}
      try {
        var origQS = Document.prototype.querySelector;
        Document.prototype.querySelector = function (sel) {
          if (typeof sel === 'string' && sel.indexOf('data-nf-variant') !== -1) return null;
          return origQS.apply(this, arguments);
        };
      } catch(e) {}
      function removeNetlify() {
        var frames = document.querySelectorAll('#nl-badge-frame, #nl-hud-frame, iframe[title*="Netlify"], iframe[id*="nl-"], [data-netlify-hud], script[data-nf-variant]');
        for (var i = 0; i < frames.length; i++) {
          var el = frames[i];
          if (el.tagName === 'IFRAME' || el.tagName === 'SCRIPT') {
            el.remove();
          } else {
            el.style.setProperty('display', 'none', 'important');
            el.style.setProperty('visibility', 'hidden', 'important');
          }
        }
      }
      if (window.MutationObserver) {
        new MutationObserver(removeNetlify).observe(document.documentElement, { childList: true, subtree: true });
      }
      document.addEventListener("DOMContentLoaded", removeNetlify);
      window.addEventListener("load", removeNetlify);
      setInterval(removeNetlify, 150);
    })();
  </script>
